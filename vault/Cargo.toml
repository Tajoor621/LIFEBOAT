[package]
name = "lifeboat-vault-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Immutable local ciphertext storage and authenticated LIFEBOAT vault API"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "tokio"] }
blake3 = "1.8"
getrandom = "0.3"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
