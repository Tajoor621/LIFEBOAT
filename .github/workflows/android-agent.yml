name: Android Sentinel checks

on:
  push:
    branches: [main]
    paths:
      - "android-agent/**"
      - "docs/P2_*.md"
      - ".github/workflows/android-agent.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android Sentinel
        working-directory: android-agent
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeboat-sentinel-debug-${{ github.sha }}
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify least-privilege manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android-agent/app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = {node.get(android + "name") for node in root if node.tag == "uses-permission"}
          assert permissions == {"android.permission.READ_CONTACTS"}, permissions
          forbidden = {"uses-permission-sdk-23", "uses-feature"}
          assert not any(node.tag in forbidden for node in root), "Unexpected manifest capability"
          app = root.find("application")
          assert app is not None
          forbidden_components = {"service", "receiver", "provider"}
          assert not any(node.tag in forbidden_components for node in app), "Unexpected background component"
          print("P2.2 manifest boundary verified: READ_CONTACTS only")
          PY
