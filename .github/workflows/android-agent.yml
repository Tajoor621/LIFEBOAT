name: Android Sentinel checks
on:
  push:
    branches: [main]
    paths:
      - "android-agent/**"
      - "docs/P2_*.md"
      - ".github/workflows/android-agent.yml"
      - "README.md"
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "pwa.css"
      - "pwa.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android Sentinel
        working-directory: android-agent
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify least-privilege manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android-agent/app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = {node.get(android + "name") for node in root if node.tag == "uses-permission"}
          assert permissions == {"android.permission.READ_CONTACTS", "android.permission.READ_EXTERNAL_STORAGE", "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO", "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"}, permissions
          assert not any(node.tag in {"uses-permission-sdk-23", "uses-feature"} for node in root)
          app = root.find("application")
          assert app is not None
          assert not any(node.tag in {"service", "receiver", "provider"} for node in app)
          external = next(node for node in root if node.tag == "uses-permission" and node.get(android + "name") == "android.permission.READ_EXTERNAL_STORAGE")
          assert external.get(android + "maxSdkVersion") == "32"
          print("P2.3 manifest boundary verified: contacts + scoped media permissions only")
          PY
      - name: Verify APK package, SDK range, alignment and signature
        id: verify_apk
        run: |
          APK="android-agent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.tajoor621.lifeboat' versionCode='3'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "sdkVersion:'26'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'35'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Install and launch APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android-agent/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tajoor621.lifeboat/.MainActivity
            sleep 3
            adb shell pidof com.tajoor621.lifeboat
      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-unset}"
          find "${ANDROID_AVD_HOME:-$HOME/.android/avd}" -maxdepth 2 -type f -name '*.log' -print -exec tail -n 120 {} \; 2>/dev/null || true
      - name: Prepare APK checksum
        if: always() && steps.verify_apk.outcome == 'success'
        run: |
          APK="android-agent/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" | tee android-agent/app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "## LIFEBOAT Android debug APK"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Package: `com.tajoor621.lifeboat`"
            echo "- SHA-256:"
            echo "```"
            cat android-agent/app/build/outputs/apk/debug/app-debug.apk.sha256
            echo "```"
            if [ "${{ steps.*.outcome }}" = "success" ]; then echo "- Android emulator install and launch: passed."; else echo "- Android emulator install and launch: see job result; artifact is a build-verified debug APK only."; fi
            echo "- Debug/test build, not a production-signed release."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build-verified debug APK and checksum
        if: always() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lifeboat-sentinel-debug-${{ github.sha }}
          path: |
            android-agent/app/build/outputs/apk/debug/app-debug.apk
            android-agent/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 90
