name: Android Sentinel checks

on:
  push:
    branches: [main]
    paths:
      - "android-agent/**"
      - "docs/P2_*.md"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android Sentinel
        working-directory: android-agent
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify permission-free P2.0 manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android-agent/app/src/main/AndroidManifest.xml").getroot()
          forbidden = {"uses-permission", "uses-permission-sdk-23", "uses-feature"}
          found = [node.tag for node in root if node.tag in forbidden]
          assert not found, f"P2.0 must not declare permissions/features: {found}"
          app = root.find("application")
          assert app is not None
          forbidden_components = {"service", "receiver", "provider"}
          components = [node.tag for node in app if node.tag in forbidden_components]
          assert not components, f"Unexpected components: {components}"
          print("P2.0 manifest permission/component boundary verified")
          PY
