name: P0 decision engine

on:
  push:
    branches: [main]
    paths:
      - "decision-engine/**"
      - ".github/workflows/decision-engine.yml"
  pull_request:
    paths:
      - "decision-engine/**"
      - ".github/workflows/decision-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path decision-engine/Cargo.toml --all -- --check
      - name: Unit tests
        run: cargo test --manifest-path decision-engine/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path decision-engine/Cargo.toml --all-targets -- -D warnings
