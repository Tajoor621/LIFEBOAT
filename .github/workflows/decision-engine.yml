name: Rust workspace checks

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "decision-engine/**"
      - "core-crypto/**"
      - "vault/**"
      - ".github/workflows/decision-engine.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "decision-engine/**"
      - "core-crypto/**"
      - "vault/**"
      - ".github/workflows/decision-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build production container image
        run: docker build -t lifeboat-vault:ci .
